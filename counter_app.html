<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center space-y-6 transform transition-all hover:shadow-2xl">
        <header>
            <h1 class="text-2xl font-bold text-slate-800">Counter App</h1>
            <p class="text-sm text-slate-500 mt-1">Tap buttons to adjust the count</p>
        </header>

        <div class="py-6 bg-slate-50 rounded-xl border border-slate-100">
            <span id="counter" class="text-6xl font-extrabold text-slate-800 transition-all duration-200">
                0
            </span>
        </div>

        <div class="flex items-center justify-center gap-3">
            <button 
                id="decrement-btn"
                aria-label="Decrement count"
                class="flex-1 bg-red-500 hover:bg-red-600 active:scale-95 text-white text-2xl font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all cursor-pointer select-none">
                −
            </button>
            <button 
                id="reset-btn"
                aria-label="Reset count"
                class="bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all cursor-pointer select-none">
                Reset
            </button>
            <button 
                id="increment-btn"
                aria-label="Increment count"
                class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-2xl font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all cursor-pointer select-none">
                +
            </button>
        </div>
    </main>

    <script>
        // State variable
        let count = 0;

        // DOM Elements
        const counterElement = document.getElementById('counter');
        const incrementBtn = document.getElementById('increment-btn');
        const decrementBtn = document.getElementById('decrement-btn');
        const resetBtn = document.getElementById('reset-btn');

        function updateDisplay() {
            counterElement.textContent = count;
            
            // Subtle color dynamic based on count value
            if (count > 0) {
                counterElement.className = 'text-6xl font-extrabold text-emerald-600 transition-all duration-200';
            } else if (count < 0) {
                counterElement.className = 'text-6xl font-extrabold text-red-500 transition-all duration-200';
            } else {
                counterElement.className = 'text-6xl font-extrabold text-slate-800 transition-all duration-200';
            }
        }

        incrementBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateDisplay();
        });
    </script>
</body>
</html>
